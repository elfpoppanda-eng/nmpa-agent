<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国内NMPA不良反应通报监测</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1e222b; --border:#2a2f3a;
    --text:#e8eaed; --muted:#9aa1ab; --accent:#4f8dfd; --accent2:#7c5cff;
    --warn:#f5a623; --danger:#ff5c5c; --ok:#3ecf8e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#0f1115,#14171d 400px,#0f1115); color:var(--text);
    min-height:100vh; padding:24px 16px 60px;
  }
  .wrap{max-width:880px; margin:0 auto;}
  header{margin-bottom:20px;}
  h1{font-size:22px; margin:0 0 6px; display:flex; align-items:center; gap:8px;}
  .sub{color:var(--muted); font-size:13px; line-height:1.6;}
  .toolbar{
    display:flex; gap:10px; flex-wrap:wrap; margin:16px 0; align-items:center;
  }
  select, input[type=text]{
    background:var(--card2); border:1px solid var(--border); color:var(--text);
    padding:8px 10px; border-radius:8px; font-size:13px;
  }
  input[type=text]{flex:1; min-width:160px;}
  button{
    background:var(--accent); border:none; color:#fff; padding:8px 14px;
    border-radius:8px; font-size:13px; cursor:pointer; font-weight:600;
  }
  button.secondary{background:var(--card2); border:1px solid var(--border); color:var(--text);}
  button:disabled{opacity:.5; cursor:not-allowed;}
  .status{font-size:12px; color:var(--muted); margin:8px 0 4px; min-height:16px;}
  .list{display:flex; flex-direction:column; gap:10px; margin-top:14px;}
  .item{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:14px 16px; cursor:pointer; transition:border-color .15s;
  }
  .item:hover{border-color:var(--accent);}
  .item-top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
  .item-title{font-size:14px; font-weight:600; line-height:1.5;}
  .tag{
    font-size:11px; padding:2px 8px; border-radius:999px; white-space:nowrap;
    border:1px solid var(--border); color:var(--muted); flex-shrink:0;
  }
  .tag.bulletin{color:var(--danger); border-color:var(--danger);}
  .tag.newsletter{color:var(--accent); border-color:var(--accent);}
  .tag.label{color:var(--warn); border-color:var(--warn);}
  .tag.data{color:var(--ok); border-color:var(--ok);}
  .item-date{font-size:12px; color:var(--muted); margin-top:6px;}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:40px 0;}

  .modal-mask{
    position:fixed; inset:0; background:rgba(0,0,0,.6); display:none;
    align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:50; overflow-y:auto;
  }
  .modal-mask.open{display:flex;}
  .modal{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    max-width:680px; width:100%; padding:22px; margin-bottom:40px;
  }
  .modal h2{font-size:16px; margin:0 0 4px; line-height:1.5;}
  .modal .meta{font-size:12px; color:var(--muted); margin-bottom:14px;}
  .modal .meta a{color:var(--accent);}
  .ai-box{
    background:var(--card2); border:1px solid var(--border); border-radius:10px;
    padding:14px; font-size:13px; line-height:1.75; white-space:pre-wrap;
  }
  .ai-box.loading{color:var(--muted);}
  .close-btn{float:right; background:none; color:var(--muted); font-size:18px; padding:0 4px;}
  .footer-note{font-size:11px; color:var(--muted); margin-top:26px; line-height:1.7; border-top:1px solid var(--border); padding-top:14px;}
  code{background:var(--card2); padding:1px 6px; border-radius:4px; font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🇨🇳 国内NMPA不良反应通报监测</h1>
    <div class="sub">
      聚合国家药监局（NMPA）/ 国家药品不良反应监测中心（CDR-ADR）发布的说明书修订公告、
      药物警戒快讯、信息通报等，并用AI生成中文要点解读 —— 比FAERS更贴近国内监管与用药场景。
    </div>
  </header>

  <div class="toolbar">
    <select id="typeFilter">
      <option value="all">全部类型</option>
      <option value="bulletin">信息通报</option>
      <option value="newsletter">警戒快讯</option>
      <option value="label">说明书修订/注册公告</option>
      <option value="data">数据发布</option>
    </select>
    <input type="text" id="searchBox" placeholder="按药品名/关键词筛选…">
    <button id="refreshBtn">刷新列表</button>
  </div>
  <div class="status" id="status">正在加载…</div>
  <div class="list" id="list"></div>
</div>

<div class="modal-mask" id="modalMask">
  <div class="modal">
    <button class="close-btn" id="closeModal">✕</button>
    <h2 id="modalTitle"></h2>
    <div class="meta" id="modalMeta"></div>
    <div class="ai-box loading" id="aiBox">AI正在解读中，请稍候…</div>
  </div>
</div>

<div class="wrap">
  <div class="footer-note">
    数据来源：国家药品监督管理局（nmpa.gov.cn）及国家药品不良反应监测中心（cdr-adr.org.cn）公开页面，
    通过自建的只读CORS代理抓取，非官方API，页面结构变化可能导致解析失效，请以原文链接为准。
    AI解读由 DeepSeek 生成，仅供参考，不构成用药或监管决策依据。
  </div>
</div>

<script>
// ====== 配置区：改成你自己的 Worker 地址 ======
const CORS_PROXY = "https://nmpa-cors-proxy.elfpoppanda.workers.dev/?url=";
const AI_PROXY = "https://faers-ai-proxy.elfpoppanda.workers.dev/";
// ================================================

const LIST_PAGE = "https://www.cdr-adr.org.cn/drug_1/aqjs_1/";

const els = {
  list: document.getElementById("list"),
  status: document.getElementById("status"),
  typeFilter: document.getElementById("typeFilter"),
  searchBox: document.getElementById("searchBox"),
  refreshBtn: document.getElementById("refreshBtn"),
  modalMask: document.getElementById("modalMask"),
  modalTitle: document.getElementById("modalTitle"),
  modalMeta: document.getElementById("modalMeta"),
  aiBox: document.getElementById("aiBox"),
  closeModal: document.getElementById("closeModal"),
};

let allItems = [];

function classify(href) {
  if (href.includes("drug_aqjs_jjkx")) return { key: "newsletter", label: "警戒快讯" };
  if (href.includes("drug_aqjs_xxtb")) return { key: "bulletin", label: "信息通报" };
  if (href.includes("drug_aqjs_sjbg")) return { key: "data", label: "数据发布" };
  if (href.includes("ypshmshxdgg")) return { key: "label", label: "说明书修订公告" };
  if (href.includes("ggtg")) return { key: "label", label: "监管公告" };
  return { key: "bulletin", label: "通报" };
}

// 解析 aqjs_1 聚合列表页：抓取所有 <a href title> 且其后邻近出现日期的条目，
// 借此过滤掉页头/页脚的导航链接（导航链接后面不会紧跟日期）。
function parseList(html) {
  const items = [];
  const seen = new Set();
  const anchorRe = /<a\s+[^>]*href="([^"]+)"[^>]*>([^<]{6,200})<\/a>/gi;
  let m;
  while ((m = anchorRe.exec(html)) !== null) {
    const href = m[1];
    let title = m[2].replace(/\s+/g, " ").trim();
    if (!title || title.length < 6) continue;
    if (!/cdr-adr\.org\.cn|nmpa\.gov\.cn/.test(href) && !href.startsWith("/")) continue;
    // 在该链接后 400 字符内找日期
    const windowText = html.slice(m.index, m.index + 500);
    const dateMatch = windowText.match(/(20\d{2}-\d{2}-\d{2})/);
    if (!dateMatch) continue;
    const absHref = href.startsWith("http") ? href : new URL(href, "https://www.cdr-adr.org.cn").href;
    if (seen.has(absHref)) continue;
    seen.add(absHref);
    items.push({
      title,
      href: absHref,
      date: dateMatch[1],
      type: classify(absHref),
    });
  }
  // 按日期倒序
  items.sort((a, b) => (a.date < b.date ? 1 : -1));
  return items;
}

function render() {
  const typeVal = els.typeFilter.value;
  const q = els.searchBox.value.trim();
  const filtered = allItems.filter(it => {
    if (typeVal !== "all" && it.type.key !== typeVal) return false;
    if (q && !it.title.includes(q)) return false;
    return true;
  });
  els.list.innerHTML = "";
  if (filtered.length === 0) {
    els.list.innerHTML = '<div class="empty">没有匹配的通报</div>';
    return;
  }
  filtered.forEach(it => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      <div class="item-top">
        <div class="item-title">${escapeHtml(it.title)}</div>
        <span class="tag ${it.type.key}">${it.type.label}</span>
      </div>
      <div class="item-date">${it.date}</div>
    `;
    div.onclick = () => openDetail(it);
    els.list.appendChild(div);
  });
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function loadList() {
  els.status.textContent = "正在从NMPA/CDR-ADR抓取最新列表…";
  els.refreshBtn.disabled = true;
  try {
    const resp = await fetch(CORS_PROXY + encodeURIComponent(LIST_PAGE));
    if (!resp.ok) throw new Error("代理返回状态码 " + resp.status);
    const html = await resp.text();
    allItems = parseList(html);
    if (allItems.length === 0) {
      els.status.textContent = "抓取成功但未解析出条目，可能是页面结构变化，请检查代理和解析逻辑。";
    } else {
      els.status.textContent = `共 ${allItems.length} 条，最新更新于 ${allItems[0].date}`;
    }
    render();
  } catch (err) {
    els.status.textContent = "加载失败：" + err.message + "（请确认 CORS_PROXY 地址已正确部署并填入代码）";
    els.list.innerHTML = "";
  } finally {
    els.refreshBtn.disabled = false;
  }
}

// 从详情页HTML里粗略提取正文文本：去标签、去脚本样式，
// 再按行过滤掉过短的行（多是导航/页脚项），保留长句正文。
function extractText(html) {
  let s = html
    .replace(/<script[\s\S]*?<\/script>/gi, " ")
    .replace(/<style[\s\S]*?<\/style>/gi, " ")
    .replace(/<br\s*\/?>/gi, "\n")
    .replace(/<\/(p|div|li|tr|h[1-6])>/gi, "\n")
    .replace(/<[^>]+>/g, " ")
    .replace(/&nbsp;/g, " ")
    .replace(/&amp;/g, "&")
    .replace(/&lt;/g, "<")
    .replace(/&gt;/g, ">")
    .replace(/&quot;/g, '"');

  const lines = s.split("\n").map(l => l.replace(/\s+/g, " ").trim()).filter(Boolean);
  const kept = lines.filter(l => l.length >= 14 && !/^(首页|中心简介|药品|医疗器械|化妆品|政策法规|不良反应报告|药物滥用监测|安全警示|科普宣传|ICH专栏|网站地图|联系方式|国家市场监督管理总局|国家药品监督管理局)/.test(l));
  const text = kept.join("\n");
  return text.slice(0, 3500);
}

async function openDetail(item) {
  els.modalTitle.textContent = item.title;
  els.modalMeta.innerHTML = `${item.date} · ${item.type.label} · <a href="${item.href}" target="_blank" rel="noopener">查看原文</a>`;
  els.aiBox.textContent = "AI正在解读中，请稍候…";
  els.aiBox.className = "ai-box loading";
  els.modalMask.classList.add("open");

  try {
    const resp = await fetch(CORS_PROXY + encodeURIComponent(item.href));
    if (!resp.ok) throw new Error("代理返回状态码 " + resp.status);
    const html = await resp.text();
    const text = extractText(html);
    if (!text) throw new Error("未能提取到正文内容");
    await interpret(item, text);
  } catch (err) {
    els.aiBox.textContent = "获取或解读正文失败：" + err.message;
    els.aiBox.className = "ai-box";
  }
}

async function interpret(item, bodyText) {
  const systemPrompt = `你是一名资深药物警戒（PV）专家，正在帮助一名有三年医院药学经验、目前准备转岗外企药物警戒/药品注册岗位的药师快速读懂国家药监局(NMPA)/国家药品不良反应监测中心(CDR-ADR)发布的通报类文件。
请用简洁的中文，按以下结构输出：
1. 【文件性质】一句话说明这是什么类型的文件（信息通报/警戒快讯/说明书修订公告/数据发布等），针对哪些药品或品类。
2. 【核心安全信息】列出2-4条关键风险点或结论，用短句。
3. 【监管动作】说明文件要求的具体措施（如修订说明书哪些项目、暂停使用、转换处方药等），没有则写"无具体监管动作，为信息通报性质"。
4. 【PV/注册视角提示】1-2句，从药物警戒信号管理或药品注册合规的角度，这条信息值得关注的点是什么。
不要编造原文没有的信息；如果正文被截断导致信息不全，请明确说明"以上基于部分正文，完整信息请查看原文链接"。`;

  const userPrompt = `文件标题：${item.title}\n发布日期：${item.date}\n\n正文（可能因抓取而不完整）：\n${bodyText}`;

  const resp = await fetch(AI_PROXY, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ systemPrompt, userPrompt }),
  });
  if (!resp.ok) throw new Error("AI代理返回状态码 " + resp.status);
  const data = await resp.json();
  const textOut = (data.content || [])
    .filter(b => b.type === "text")
    .map(b => b.text)
    .join("\n")
    .trim();
  els.aiBox.textContent = textOut || "AI未返回有效内容。";
  els.aiBox.className = "ai-box";
}

els.refreshBtn.onclick = loadList;
els.typeFilter.onchange = render;
els.searchBox.oninput = render;
els.closeModal.onclick = () => els.modalMask.classList.remove("open");
els.modalMask.onclick = e => { if (e.target === els.modalMask) els.modalMask.classList.remove("open"); };

loadList();
</script>
</body>
</html>
